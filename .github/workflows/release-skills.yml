name: Release Skills

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - '.github/workflows/release-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-skills
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build skills archive
        run: |
          set -euo pipefail
          mkdir -p dist
          archive_name="skills-repo-skills-${GITHUB_SHA::7}.zip"
          (
            cd .
            zip -r "dist/${archive_name}" skills
          )
          echo "archive_name=${archive_name}" >> "$GITHUB_ENV"

      - name: Build release notes from latest skills commit
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s -- skills)"
          body="$(git log -1 --format=%b -- skills)"
          commit_short="$(git log -1 --format=%h -- skills)"
          commit_full="$(git log -1 --format=%H -- skills)"
          commit_date="$(git log -1 --date=iso --format=%ad -- skills)"
          skill_count="$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${commit_full}"

          {
            echo "Rolling pre-release archive for the latest snapshot of the \`skills/\` directory."
            echo
            echo "## Package Snapshot"
            echo
            echo "- **Archive**: \`${archive_name}\`"
            echo "- **Included directory**: \`skills/\`"
            echo "- **Skill count**: ${skill_count}"
            echo "- **Commit**: [\`${commit_short}\`](${commit_url})"
            echo "- **Author**: Yumih"
            echo "- **Updated at**: ${commit_date}"
            echo
            echo "## Latest Skills Note"
            echo
            echo "> ${subject}"
            if [ -n "${body}" ]; then
              echo
              echo "### Details"
              echo
              echo "${body}"
            fi
          } > dist/release-notes.md

      - name: Create or update rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view skills-latest >/dev/null 2>&1; then
            gh release create skills-latest \
              --title "SKILLS Package" \
              --notes-file dist/release-notes.md \
              --prerelease
          else
            gh release edit skills-latest \
              --title "SKILLS Package" \
              --notes-file dist/release-notes.md \
              --prerelease
          fi

      - name: Upload archive to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload skills-latest "dist/${archive_name}" --clobber
