name: Release Skills

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - '.github/workflows/release-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-skills
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build skills archive
        run: |
          set -euo pipefail
          mkdir -p dist
          archive_name="skills-repo-skills-${GITHUB_SHA::7}.zip"
          (
            cd .
            zip -r "dist/${archive_name}" skills
          )
          echo "archive_name=${archive_name}" >> "$GITHUB_ENV"

      - name: Build release metadata
        run: |
          set -euo pipefail
          release_stamp="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M')"
          release_tag="skills-package-${release_stamp}-${GITHUB_SHA::7}"
          release_title="SKILLS Package · ${release_stamp}"
          echo "release_tag=${release_tag}" >> "$GITHUB_ENV"
          echo "release_title=${release_title}" >> "$GITHUB_ENV"

      - name: Build release notes from latest skills commit
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s -- skills)"
          body="$(git log -1 --format=%b -- skills)"
          commit_short="$(git log -1 --format=%h -- skills)"
          commit_full="$(git log -1 --format=%H -- skills)"
          commit_date="$(TZ='Asia/Shanghai' git log -1 --date=format:'%Y-%m-%d %H:%M +08' --format=%ad -- skills)"
          skill_count="$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${commit_full}"

          {
            echo "Archive for the latest snapshot of the \`skills/\` directory."
            echo
            echo "## Package Snapshot"
            echo
            echo "<table>"
            echo "  <tbody>"
            echo "    <tr><td><strong>Archive</strong></td><td><code>${archive_name}</code></td></tr>"
            echo "    <tr><td><strong>Directory</strong></td><td><code>skills/</code></td></tr>"
            echo "    <tr><td><strong>Skill Count</strong></td><td>${skill_count}</td></tr>"
            echo "    <tr><td><strong>Commit</strong></td><td><a href=\"${commit_url}\"><code>${commit_short}</code></a></td></tr>"
            echo "    <tr><td><strong>Author</strong></td><td>Yumih</td></tr>"
            echo "    <tr><td><strong>Updated At</strong></td><td>${commit_date}</td></tr>"
            echo "  </tbody>"
            echo "</table>"
            echo
            echo "## Skills Note"
            echo
            echo "> ${subject}"
            if [ -n "${body}" ]; then
              echo
              echo "### Details"
              echo
              echo "${body}"
            fi
          } > dist/release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${release_tag}" \
            --title "${release_title}" \
            --notes-file dist/release-notes.md \
            --prerelease

      - name: Upload archive to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${release_tag}" "dist/${archive_name}" --clobber
